<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="sign-up-portal">
        <div class="username-wrapper">
            <label for="username" id="username">Username: </label>
            <input type="text" id="username-input">
            <span class="display-error" id="username-error"></span>
        </div>

        <div class="email-wrapper">
            <label for="email" id="email">Email: </label>
            <input type="text" id="email-input">
            <span class="display-error" id="email-error"></span>
        </div>

        <div class="password-wrapper">
            <label for="password" id="password">Password: </label>
            <input type="password" id="password-input">
            <span class="display-error" id="password-error"></span>
        </div>

        <div class="terms-wrapper">
            <label for="terms" id="terms">Terms:</label>
            <input type="checkbox" id="terms-input">
            <span class="display-error" id="terms-error"></span>
        </div>
        <div class="submit-wrapper">
            <button type="submit" id="submit-btn">Submit</button>
        </div>


    </form>



</body>

<script src="validation.js"></script>

</html>
